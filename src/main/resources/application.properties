spring.application.name=UberProject-AuthService
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=jdbc:mysql://localhost:3306/uber_db_local
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.show-sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8084
spring.devtools.restart.enabled=false


# to enable lazy loading in spring data jpa
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
logging.level.org.springframework.data=DEBUG
spring.flyway.url=jdbc:mysql://localhost:3306/uber_db_local
spring.flyway.user=root
spring.flyway.password=1234
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
jwt.expiry=3600
jwt.secret=siddharth shukla indian Institute of Information Technology

